[package]
name = "l2-aggregator"
version = "0.1.0"
edition = "2024"

[dependencies]
rand = "0.10.2"
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
futures-util = "0.3.34"
url = "2.5.8"
bytes = "1.12.1"
anyhow = "1.0.104"
serde_json = "1.0.151"
rust_decimal = { version = "1.43.0", features = ["serde"] }
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "macros", "tls-native-tls", "chrono", "rust_decimal", ] }
chrono = { version = "0.4.45", features = ["serde"] }
rdkafka = { version = "0.36", features = ["cmake-build", "tokio"] }
redis = { version = "1.7.0", features = ["tokio-comp", "connection-manager"] }
thiserror = "2.0.20"
