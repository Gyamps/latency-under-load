---
apiVersion: v1
kind: Namespace
metadata:
  name: orderbook
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aggregator-config
  namespace: orderbook
data:
  SYMBOLS: "BTC-USD,ETH-USD,SOL-USD,ADA-USD,XRP-USD,DOGE-USD"
  KAFKA_BROKERS: "redpanda:9092"
  KAFKA_TOPIC: "l2-market-data"
  REDIS_URL: "redis://redis:6379"
  DATABASE_URL: "postgres://postgres:postgres@timescaledb:5432/orderbook"
---
# ==========================================
# INFRASTRUCTURE: Redpanda, Redis, Postgres
# ==========================================
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redpanda
  namespace: orderbook
spec:
  replicas: 1
  serviceName: redpanda
  selector:
    matchLabels:
      app: redpanda
  template:
    metadata:
      labels:
        app: redpanda
    spec:
      containers:
        - name: redpanda
          image: redpandadata/redpanda:latest
          args:
            - redpanda
            - start
            - --smp 1 # Restrict to 1 CPU core for local environment
            - --memory 1G
            - --reserve-memory 0M
            - --overprovisioned
            - --node-id 0
            - --kafka-addr 0.0.0.0:9092
            - --advertise-kafka-addr redpanda:9092
          ports:
            - containerPort: 9092
---
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: orderbook
spec:
  ports:
    - port: 9092
  selector:
    app: redpanda
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: orderbook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: orderbook
spec:
  ports:
    - port: 6379
  selector:
    app: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: timescaledb
  namespace: orderbook
spec:
  replicas: 1
  selector:
    matchLabels:
      app: timescaledb
  template:
    metadata:
      labels:
        app: timescaledb
    spec:
      containers:
        - name: timescaledb
          image: timescale/timescaledb:latest-pg15
          env:
            - name: POSTGRES_PASSWORD
              value: "postgres"
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: timescaledb
  namespace: orderbook
spec:
  ports:
    - port: 5432
  selector:
    app: timescaledb
---
# =============================================
# APPLICATION: L2 crypto orderbook Aggregator
# =============================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: l2-aggregator
  namespace: orderbook
spec:
  replicas: 1 # we don't need duplicate WebSocket connections
  selector:
    matchLabels:
      app: l2-aggregator
  template:
    metadata:
      labels:
        app: l2-aggregator
    spec:
      containers:
        - name: app
          image: l2-aggregator:latest
          imagePullPolicy: Never # Force Kubernetes to use the locally built Minikube image
          envFrom:
            - configMapRef:
                name: aggregator-config
          resources:
            requests:
              cpu: "250m"
              memory: "128Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
